<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Before and after tiling">
  <rect width="960" height="420" fill="#F0F2F5"/>
  <text x="180" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#334155" font-weight="700">Before</text>
  <text x="720" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#334155" font-weight="700">After</text>
  <!-- Before: overlapping -->
  <g transform="translate(70,80) rotate(-8 120 80)">
    <rect width="200" height="160" rx="10" fill="#fff" stroke="#94A3B8" stroke-width="2"/>
    <rect width="200" height="28" rx="10" fill="#E2E8F0"/>
    <rect x="16" y="48" width="60" height="40" rx="4" fill="#CBD5E1"/>
    <rect x="90" y="52" width="80" height="8" rx="2" fill="#CBD5E1"/>
    <rect x="90" y="68" width="60" height="8" rx="2" fill="#CBD5E1"/>
  </g>
  <g transform="translate(130,110) rotate(6 120 80)">
    <rect width="200" height="160" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
    <rect width="200" height="28" rx="10" fill="#BFDBFE"/>
    <rect x="20" y="56" width="160" height="10" rx="2" fill="#93C5FD"/>
    <rect x="20" y="80" width="120" height="10" rx="2" fill="#93C5FD"/>
  </g>
  <g transform="translate(90,150) rotate(-3 120 80)">
    <rect width="200" height="160" rx="10" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2"/>
    <rect width="200" height="28" rx="10" fill="#BBF7D0"/>
    <circle cx="50" cy="90" r="28" fill="#86EFAC"/>
  </g>
  <!-- Arrow -->
  <path d="M430 210 H520" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <path d="M500 190 L530 210 L500 230" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- After: three columns -->
  <g transform="translate(560,90)">
    <rect x="0" y="0" width="110" height="260" rx="10" fill="#fff" stroke="#64748B" stroke-width="2"/>
    <rect x="0" y="0" width="110" height="28" rx="10" fill="#E2E8F0"/>
    <rect x="125" y="0" width="110" height="260" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="125" y="0" width="110" height="28" rx="10" fill="#BFDBFE"/>
    <rect x="250" y="0" width="110" height="260" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
    <rect x="250" y="0" width="110" height="28" rx="10" fill="#BBF7D0"/>
  </g>
</svg>
